name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

          # Set session/cache ke file-based (tidak butuh database)
          sed -i '/^SESSION_DRIVER=/d' .env
          echo "SESSION_DRIVER=file" >> .env
          sed -i '/^CACHE_STORE=/d' .env
          echo "CACHE_STORE=file" >> .env
          sed -i '/^CACHE_DRIVER=/d' .env
          echo "CACHE_DRIVER=file" >> .env

          # Nonaktifkan database sepenuhnya
          sed -i '/^DB_CONNECTION=/d' .env
          sed -i '/^DB_HOST=/d' .env
          sed -i '/^DB_PORT=/d' .env
          sed -i '/^DB_DATABASE=/d' .env
          sed -i '/^DB_USERNAME=/d' .env
          sed -i '/^DB_PASSWORD=/d' .env

          # Set APP_URL ke GitHub Pages URL (base URL aplikasi)
          sed -i '/^APP_URL=/d' .env
          echo "APP_URL=https://bernardsubur.github.io/portofolio" >> .env

          # KUNCI UTAMA: ASSET_URL adalah variabel yang benar-benar mengontrol
          # output fungsi asset() di Laravel. Dengan ini, asset('css/style.css')
          # pasti menghasilkan: https://bernardsubur.github.io/portofolio/css/style.css
          sed -i '/^ASSET_URL=/d' .env
          echo "ASSET_URL=https://bernardsubur.github.io/portofolio" >> .env

          echo "=== Isi .env yang relevan ==="
          grep -E "^(APP_URL|ASSET_URL|SESSION_DRIVER|CACHE)" .env

      - name: Prepare Laravel storage
        run: |
          # Buat semua folder storage yang dibutuhkan Laravel
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache/data
          mkdir -p storage/logs
          chmod -R 775 storage bootstrap/cache
          echo "Storage directories created."

      - name: Clear Laravel cache
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan view:clear

      - name: Start Laravel server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          echo "Laravel server starting..."
          # Tunggu sampai server benar-benar siap (maksimal 30 detik)
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/ 2>/dev/null)
            if [[ "$STATUS" == "200" || "$STATUS" == "301" || "$STATUS" == "302" ]]; then
              echo "Server ready! HTTP status: $STATUS (attempt $i)"
              break
            fi
            echo "Waiting... attempt $i/15 (status: $STATUS)"
            sleep 2
          done
          # Tampilkan log server untuk debug jika ada masalah
          echo "=== Laravel server log ==="
          cat /tmp/laravel.log

      - name: Generate static HTML
        run: |
          mkdir -p dist
          # Ambil halaman, jika gagal tampilkan detail error
          if ! curl -f -L http://127.0.0.1:8000/ -o dist/index.html; then
            echo "=== CURL GAGAL - Laravel server log: ==="
            cat /tmp/laravel.log
            exit 1
          fi
          echo "=== Berhasil! 80 baris pertama index.html ==="
          head -80 dist/index.html

      - name: Copy public assets to dist
        run: |
          cp -r public/css dist/css
          cp -r public/js dist/js
          cp -r public/images dist/images
          cp -r public/build dist/build 2>/dev/null || echo "Tidak ada folder build"
          cp -r public/cv dist/cv 2>/dev/null || echo "Tidak ada folder cv"
          cp public/favicon.ico dist/favicon.ico 2>/dev/null || true
          cp public/robots.txt dist/robots.txt 2>/dev/null || true

      - name: Verify dist structure
        run: |
          echo "=== Semua file dalam dist: ==="
          find dist -type f | sort
          echo ""
          echo "=== Verifikasi path CSS di HTML: ==="
          grep -i "css/style" dist/index.html | head -5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4