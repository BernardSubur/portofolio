name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "SESSION_DRIVER=file" >> .env

      - name: Start Laravel server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          sleep 5

      - name: Generate static website
        run: |
          mkdir -p dist
          curl -L http://127.0.0.1:8000/ -o dist/index.html

      - name: Copy public assets
        run: |
          cp -r public/images dist/images
          cp -r public/css dist/css
          cp -r public/js dist/js
          cp -r public/build dist/build 2>/dev/null || true
          cp -r public/cv dist/cv 2>/dev/null || true
          cp public/favicon.ico dist/favicon.ico 2>/dev/null || true
          cp public/robots.txt dist/robots.txt 2>/dev/null || true

      - name: Fix asset paths for GitHub Pages
        run: |
          sed -i 's|href="/|href="./|g' dist/index.html
          sed -i 's|src="/|src="./|g' dist/index.html
          sed -i 's|url(/|url(./|g' dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4