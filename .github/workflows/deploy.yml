name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Setup PHP ──────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, tokenizer
          coverage: none

      # ─── 3. Install PHP dependencies ───────────────────────────────────────
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # ─── 4. Setup Node.js ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ─── 5. Install & Build frontend ───────────────────────────────────────
      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets (Vite + Tailwind)
        run: npm run build

      # ─── 6. Setup Laravel environment ──────────────────────────────────────
      - name: Setup Laravel .env
        run: |
          cp .env.example .env

          # Pastikan semua driver menggunakan file (tidak butuh database)
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env

          # Hapus semua konfigurasi database
          sed -i '/^DB_CONNECTION=/d' .env
          sed -i '/^DB_HOST=/d' .env
          sed -i '/^DB_PORT=/d' .env
          sed -i '/^DB_DATABASE=/d' .env
          sed -i '/^DB_USERNAME=/d' .env
          sed -i '/^DB_PASSWORD=/d' .env

          # Set URL untuk GitHub Pages
          sed -i 's|^APP_URL=.*|APP_URL=https://bernardsubur.github.io/portofolio|' .env
          echo "ASSET_URL=https://bernardsubur.github.io/portofolio" >> .env

          # Set environment ke local agar tidak butuh HTTPS
          sed -i 's/^APP_ENV=.*/APP_ENV=local/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' .env

          echo "=== Konfigurasi .env yang aktif ==="
          grep -E "^(APP_URL|APP_ENV|ASSET_URL|SESSION_DRIVER|CACHE_STORE|QUEUE_CONNECTION)" .env

      # ─── 7. Generate app key ───────────────────────────────────────────────
      - name: Generate application key
        run: php artisan key:generate --force

      # ─── 8. Buat folder storage ───────────────────────────────────────────
      - name: Create storage directories
        run: |
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache/data
          mkdir -p storage/app/public
          mkdir -p storage/logs
          mkdir -p bootstrap/cache
          chmod -R 777 storage bootstrap/cache
          echo "OK: Semua folder storage sudah dibuat."

      # ─── 9. Clear cache ───────────────────────────────────────────────────
      - name: Clear Laravel cache
        run: |
          php artisan config:clear
          php artisan view:clear
          php artisan cache:clear
          echo "OK: Cache dibersihkan."

      # ─── 10. Test artisan bisa jalan ──────────────────────────────────────
      - name: Verify Laravel can boot
        run: |
          php artisan about --only=environment 2>&1 || true
          echo "Artisan check done."

      # ─── 11. Jalankan Laravel server ──────────────────────────────────────
      - name: Start Laravel server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          SERVER_PID=$!
          echo "Laravel PID: $SERVER_PID"

          # Tunggu server siap (max 40 detik)
          echo "Menunggu server siap..."
          READY=false
          for i in {1..20}; do
            sleep 2
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/ 2>/dev/null || echo "000")
            echo "  Percobaan $i/20 → HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then
              READY=true
              echo "Server SIAP! (HTTP 200)"
              break
            fi
          done

          if [[ "$READY" != "true" ]]; then
            echo "=== SERVER GAGAL SIAP - Log Laravel: ==="
            cat /tmp/laravel.log
            exit 1
          fi

      # ─── 12. Generate HTML statis ─────────────────────────────────────────
      - name: Generate static HTML from Laravel
        run: |
          mkdir -p dist

          echo "Mengambil halaman dari Laravel..."
          HTTP_CODE=$(curl -s -o dist/index.html -w "%{http_code}" http://127.0.0.1:8000/)

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "ERROR: Server mengembalikan HTTP $HTTP_CODE"
            echo "=== Laravel log ==="
            cat /tmp/laravel.log
            echo "=== Response yang diterima ==="
            cat dist/index.html 2>/dev/null | head -50
            exit 1
          fi

          echo "OK: HTML berhasil dibuat (HTTP $HTTP_CODE)"
          echo ""
          echo "=== Cek path asset di HTML ==="
          grep -E "(stylesheet|href=|src=)" dist/index.html | grep -v "^<!--" | head -20

      # ─── 13. Copy semua asset statis ──────────────────────────────────────
      - name: Copy static assets to dist
        run: |
          echo "Menyalin asset..."
          cp -r public/css dist/css && echo "OK: css/"
          cp -r public/js dist/js && echo "OK: js/"
          cp -r public/images dist/images && echo "OK: images/"
          [ -d public/build ] && cp -r public/build dist/build && echo "OK: build/" || echo "SKIP: build/ tidak ada"
          [ -d public/cv ] && cp -r public/cv dist/cv && echo "OK: cv/" || echo "SKIP: cv/ tidak ada"
          [ -f public/favicon.ico ] && cp public/favicon.ico dist/ && echo "OK: favicon.ico" || true
          [ -f public/robots.txt ] && cp public/robots.txt dist/ && echo "OK: robots.txt" || true

      # ─── 14. Verifikasi struktur dist ────────────────────────────────────
      - name: Verify dist output
        run: |
          echo "=== Semua file dalam dist/ ==="
          find dist -type f | sort
          echo ""
          echo "=== Ukuran total ==="
          du -sh dist/
          echo ""
          echo "=== Verifikasi link CSS di index.html ==="
          grep "css/style" dist/index.html | head -3

      # ─── 15. Deploy ke GitHub Pages ───────────────────────────────────────
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4